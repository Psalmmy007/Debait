<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Talk to Debait</title>
  <link rel="stylesheet" href="./voice.css" />
</head>
<body>
  <main class="card">
    <span class="word">Debait</span>
    <div class="rule thick"></div>
    <h1>Talk to Debait</h1>
    <p id="msg">Chrome will ask to use your microphone. Click <b>Allow</b> so you can talk to Debait on any website.</p>
    <button class="btn primary" id="allow">Allow microphone</button>
    <p class="small">You only do this once. The microphone is only on while "Talk to Debait" is switched on.</p>
  </main>
  <script type="module" src="./voice.js"></script>
</body>
</html>
