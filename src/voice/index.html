<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Talk to Debait</title>
  <link rel="stylesheet" href="./voice.css" />
</head>
<body>
  <main class="card">
    <span class="mic" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21"/></svg></span>
    <h1 class="title">Talk to Debait</h1>
    <p id="msg">Chrome will ask to use your microphone. Click <b>Allow</b> so you can talk to Debait on any website.</p>
    <button class="btn primary wide" id="allow">Allow microphone</button>
    <p class="small">You only do this once. The microphone is only on while "Talk to Debait" is switched on.</p>
  </main>
  <script type="module" src="./voice.js"></script>
</body>
</html>
